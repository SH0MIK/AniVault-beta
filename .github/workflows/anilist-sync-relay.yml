name: AniList list-sync relay

on:
  schedule:
    # Every 5 minutes. This is what makes "Connect AniList" / "Sync Now" /
    # pushed list edits actually happen — see scripts/anilist-sync-relay.mjs
    # for why this can't run inside the Worker.
    - cron: '*/5 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Process pending AniList pulls/pushes
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node scripts/anilist-sync-relay.mjs
