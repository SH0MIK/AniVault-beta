name: Refresh AniList season cache

on:
  schedule:
    # Every 15 minutes. GitHub may delay this slightly under load — that's
    # fine, the KV entry has a 2h TTL so a few minutes of drift is harmless.
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch AniList and push to Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: node scripts/refresh-anilist-cache.mjs
